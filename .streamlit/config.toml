# Smart Listener dashboard theme (dark industrial). Streamlit reads this file from the folder it is started in,
# so start the dashboard from the project folder:  streamlit run dashboard/app.py
[theme]
base = "dark"
primaryColor = "#4f86b5"
backgroundColor = "#121b27"
secondaryBackgroundColor = "#152130"
textColor = "#e6ecf2"
font = "sans-serif"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
