# ONE place for every audio and split setting. Training, evaluation and the app must all read this file.
# These are STARTING values. We tune them on validation data, never on test data.
# If you change anything in "audio" or "features", ALL features must be rebuilt (the fingerprint will tell you).

dataset:
  zenodo_record: "3384388"        # official MIMII record (Hitachi)
  snr_db: 6                       # we use the 6 dB recordings only
  machine_types: [fan, pump]
  machine_ids: [id_00, id_02, id_04, id_06]   # the only IDs in public release 1.0
  zips:                           # file names and md5 checksums copied from the Zenodo page
    fan:
      file: "6_dB_fan.zip"
      md5: "0890f7d3c2fd8448634e69ff1d66dd47"
    pump:
      file: "6_dB_pump.zip"
      md5: "a09ba6060c10fc09cd4c8770213b0b9f"

  # Official md5 checksums of ALL 12 files in the record (read from the Zenodo page, Oct 2026).
  # We only USE the 6 dB fan and pump files; the others are listed so downloads can still be verified.
  checksums:
    "-6_dB_fan.zip": f02ae808a58d84b6815b7ec38ff30879
    "-6_dB_pump.zip": d20b783a0ff9c93d58f452f98c37b112
    "-6_dB_slider.zip": 49913eda7d37f182cbf8ed5c984140e0
    "-6_dB_valve.zip": fdfaf185fea61b21e11952a070a4ada7
    "0_dB_fan.zip": 6354d1cc2165c52168f9ef1bcd9c7c52
    "0_dB_pump.zip": 488748295c3f60b25de07b58fe75b049
    "0_dB_slider.zip": 4d674c21474f0646ecd75546db6c0c4e
    "0_dB_valve.zip": 178478eb0d11c79080a35562bfdeee71
    "6_dB_fan.zip": 0890f7d3c2fd8448634e69ff1d66dd47
    "6_dB_pump.zip": a09ba6060c10fc09cd4c8770213b0b9f
    "6_dB_slider.zip": 838c2b3441858359c4704ef13a1b27ff
    "6_dB_valve.zip": fe5fb7c337cd701b1d31dc641e621892

audio:
  sample_rate: 16000              # Hz. Files are checked, never silently resampled.
  channel_index: 0                # 8 microphones in the original; index 0 = microphone No. 1 (same as the dataset's baseline)
  expected_duration_s: 10.0
  duration_tolerance_s: 0.5       # clips further away than this are excluded; clips inside it are padded/trimmed to exactly 10 s

features:
  n_fft: 1024
  hop_length: 512
  n_mels: 64
  fmin: 0
  fmax: 8000                      # Nyquist for 16 kHz
  power: 2.0
  amin: 1.0e-10                   # floor before taking the logarithm (absolute dB, NO per-clip scaling)
  window_frames: 64               # about 2 seconds of sound per window
  window_hop_frames: 32           # windows overlap by half
  normalization: global_per_mel_band   # mean/std per mel band, fitted on TRAINING files only

quality:                          # these only raise warnings, except the exclusion rules documented in audit.py
  clip_level: 0.999               # |sample| above this counts as clipped
  clip_fraction_warn: 0.001
  silence_block_ms: 100
  silence_block_rms: 1.0e-4       # block RMS below this (full scale = 1.0) counts as silent
  silence_fraction_warn: 0.5
  drift_min_files: 30
  drift_rho_warn: 0.3             # |Spearman rho| of loudness vs file number above this = recording order matters

split:
  seed: 42
  anomaly:                        # normal-vs-abnormal detector: one model per machine, so splits are PER machine
    strategy: interleaved         # interleaved = validation/test chunks spread over the whole recording, with gaps (default)
                                  # block = one validation block at the start, one test block at the end; random = sensitivity check
    abnormal_val_fraction: 0.5    # abnormal files go to validation/test (training uses normal only)
    interleaved_max_blocks: 16    # most chunks the abnormal sequence is cut into (multiple of 4)
    buffer_files: 5               # files dropped between blocks so neighbouring recordings never straddle a boundary
    min_train_files: 300
  classifier:                     # fan-vs-pump: split by whole machine, so a machine is never in two splits
    train_ids: [id_00, id_02]
    val_ids: [id_04]
    test_ids: [id_06]

paths:                            # relative to the repository folder
  raw_zip_dir: Dataset            # where the original ZIPs live (never committed)
  mono_dir: data/interim/mono16k
  manifest_dir: data/manifests
  features_dir: data/processed
  figures_dir: reports/figures
